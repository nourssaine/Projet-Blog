<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Portrait illustré girly et doux d'Emma, auteure du journal">
  <defs>
    <linearGradient id="avatarPinkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="50%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#ffd1dc" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c2438" />
      <stop offset="100%" stop-color="#381d28" />
    </linearGradient>
    <linearGradient id="bowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Fond circulaire doux avec contour rose pastel -->
  <circle cx="100" cy="100" r="95" fill="url(#avatarPinkBg)" stroke="#fbcfe8" stroke-width="4" />

  <!-- Petites étoiles / scintillements décoratifs ✨ -->
  <path d="M 32 45 Q 36 35 40 45 Q 45 49 40 53 Q 36 63 32 53 Q 27 49 32 45 Z" fill="#f43f5e" opacity="0.6" />
  <circle cx="165" cy="40" r="4" fill="#fb7185" opacity="0.7" />
  <circle cx="175" cy="50" r="2.5" fill="#f472b6" opacity="0.5" />
  <circle cx="28" cy="140" r="3" fill="#f472b6" opacity="0.5" />

  <!-- Chevelure arrière volumineuse -->
  <circle cx="100" cy="85" r="54" fill="url(#hairGrad)" />

  <!-- Buste / Top rose doux -->
  <path d="M 42 190 C 42 142, 68 132, 100 132 C 132 132, 158 142, 158 190 Z" fill="url(#topGrad)" />
  <!-- Col délicat en dentelle / festonné -->
  <path d="M 80 135 Q 90 148 100 138 Q 110 148 120 135" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Cou -->
  <rect x="88" y="112" width="24" height="28" rx="8" fill="#ffe4e6" />

  <!-- Visage délicat -->
  <ellipse cx="100" cy="94" rx="35" ry="40" fill="#fff1f2" />

  <!-- Chevelure avant / frange ondulée -->
  <path d="M 65 82 C 65 52, 135 52, 135 82 C 135 64, 116 58, 100 58 C 84 58, 65 64, 65 82 Z" fill="url(#hairGrad)" />
  <path d="M 65 82 Q 74 116 64 132 Q 76 126 78 100 Z" fill="url(#hairGrad)" />
  <path d="M 135 82 Q 126 116 136 132 Q 124 126 122 100 Z" fill="url(#hairGrad)" />

  <!-- Petit nœud rose girly dans les cheveux (Bow) 🎀 -->
  <g transform="translate(62, 54)">
    <!-- Ailes du nœud -->
    <path d="M 0 0 C -12 -12, -22 -4, -18 10 C -14 20, -4 12, 0 4 Z" fill="url(#bowGrad)" />
    <path d="M 0 0 C 12 -12, 22 -4, 18 10 C 14 20, 4 12, 0 4 Z" fill="url(#bowGrad)" />
    <!-- Centre du nœud -->
    <circle cx="0" cy="2" r="5" fill="#db2777" />
    <!-- Rubans qui descendent -->
    <path d="M -2 6 Q -8 20 -14 26" stroke="#fb7185" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 2 6 Q 6 18 12 24" stroke="#fb7185" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Yeux doux avec cils -->
  <circle cx="87" cy="95" r="3.5" fill="#381d28" />
  <circle cx="113" cy="95" r="3.5" fill="#381d28" />
  <!-- Cils -->
  <path d="M 83 91 Q 87 88 91 92" fill="none" stroke="#381d28" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 109 92 Q 113 88 117 91" fill="none" stroke="#381d28" stroke-width="1.5" stroke-linecap="round" />
  <line x1="91" y1="91" x2="94" y2="88" stroke="#381d28" stroke-width="1.2" stroke-linecap="round" />
  <line x1="117" y1="91" x2="120" y2="88" stroke="#381d28" stroke-width="1.2" stroke-linecap="round" />

  <!-- Blush joues rose poudré -->
  <circle cx="80" cy="104" r="8" fill="#fda4af" opacity="0.6" />
  <circle cx="120" cy="104" r="8" fill="#fda4af" opacity="0.6" />

  <!-- Sourire attendrissant -->
  <path d="M 94 111 Q 100 117 106 111" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
</svg>
