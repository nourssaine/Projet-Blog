<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Illustration girly d'un journal intime ouvert avec stylo doré, ruban adhésif décoratif et petits cœurs">
  <defs>
    <linearGradient id="bgDiaryOpen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="60%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="washiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="diaryShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#9d174d" flood-opacity="0.13" />
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="675" fill="url(#bgDiaryOpen)" />

  <!-- Confettis et cœurs flottants délicats ♡ -->
  <g fill="#ec4899" opacity="0.45">
    <path d="M 160 140 C 160 125, 145 120, 145 135 C 145 150, 160 165, 160 170 C 160 165, 175 150, 175 135 C 175 120, 160 125, 160 140 Z" />
    <path d="M 1020 180 C 1020 168, 1008 164, 1008 176 C 1008 188, 1020 200, 1020 204 C 1020 200, 1032 188, 1032 176 C 1032 164, 1020 168, 1020 180 Z" />
    <circle cx="210" cy="220" r="4.5" />
    <circle cx="970" cy="390" r="5" />
    <circle cx="1060" cy="460" r="4" />
    <circle cx="140" cy="440" r="3.5" />
  </g>

  <!-- Grand carnet intime ouvert -->
  <g transform="translate(240, 140)" filter="url(#diaryShadow)">
    <!-- Fond du carnet ouvert (reliure et bords) -->
    <rect x="0" y="0" width="720" height="420" rx="20" fill="#fce7f3" stroke="#f9d8e6" stroke-width="3" />
    
    <!-- Page gauche -->
    <rect x="18" y="16" width="332" height="388" rx="10" fill="#ffffff" />
    <!-- Page droite -->
    <rect x="370" y="16" width="332" height="388" rx="10" fill="#ffffff" />
    
    <!-- Ombre de la pliure centrale -->
    <rect x="345" y="16" width="30" height="388" fill="#fdf0f5" opacity="0.8" />
    <line x1="360" y1="16" x2="360" y2="404" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />

    <!-- Washi tape rose à motifs sur la page de gauche -->
    <rect x="40" y="36" width="100" height="24" rx="2" fill="url(#washiGrad)" opacity="0.8" transform="rotate(-5 40 36)" />
    
    <!-- Lignes d'écriture stylisées (Page gauche) -->
    <g fill="#f9a8d4" opacity="0.65">
      <rect x="50" y="90" width="220" height="8" rx="4" />
      <rect x="50" y="118" width="260" height="6" rx="3" fill="#fda4af" />
      <rect x="50" y="138" width="240" height="6" rx="3" fill="#fda4af" />
      <rect x="50" y="158" width="250" height="6" rx="3" fill="#fda4af" />
      <rect x="50" y="178" width="180" height="6" rx="3" fill="#fda4af" />
      
      <!-- Petit croquis d'un cœur et fleur sur la page gauche -->
      <path d="M 120 250 C 120 230, 95 225, 95 245 C 95 265, 120 285, 120 290 C 120 285, 145 265, 145 245 C 145 225, 120 230, 120 250 Z" fill="#fb7185" opacity="0.85" />
      <text x="160" y="265" font-family="'Plus Jakarta Sans', cursive, sans-serif" font-size="16" font-style="italic" fill="#db2777">« Chère plume... »</text>
    </g>

    <!-- Mini polaroïd épinglé sur la page de droite 📷 -->
    <g transform="translate(420, 50)" filter="url(#diaryShadow)">
      <rect x="0" y="0" width="160" height="190" rx="6" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.5" />
      <rect x="12" y="12" width="136" height="130" rx="4" fill="#fdf2f8" />
      <circle cx="80" cy="77" r="34" fill="#f472b6" opacity="0.3" />
      <path d="M 80 62 C 80 50, 65 47, 65 59 C 65 71, 80 83, 80 86 C 80 83, 95 71, 95 59 C 95 47, 80 50, 80 62 Z" fill="#e11d48" opacity="0.75" />
      <circle cx="80" cy="168" r="4" fill="#fb7185" />
      <!-- Gommette adhésive rose en haut -->
      <rect x="60" y="-8" width="40" height="16" rx="2" fill="#fda4af" opacity="0.9" />
    </g>

    <!-- Lignes d'écriture sous la photo (Page droite) -->
    <g fill="#fda4af" opacity="0.6">
      <rect x="420" y="270" width="220" height="6" rx="3" />
      <rect x="420" y="295" width="240" height="6" rx="3" />
      <rect x="420" y="320" width="190" height="6" rx="3" />
      <rect x="420" y="345" width="230" height="6" rx="3" />
    </g>
  </g>

  <!-- Stylo doré / rose gold posé délicatement sur le côté 🖊️ -->
  <g transform="translate(930, 200) rotate(22)" filter="url(#diaryShadow)">
    <!-- Corps du stylo -->
    <rect x="0" y="0" width="18" height="240" rx="9" fill="url(#penGrad)" stroke="#ffffff" stroke-width="1.5" />
    <!-- Clip doré -->
    <rect x="-4" y="25" width="6" height="70" rx="3" fill="#fbcfe8" />
    <!-- Bague métallique -->
    <rect x="0" y="180" width="18" height="6" fill="#ffffff" />
    <!-- Plume / Pointe dorée -->
    <path d="M 0 240 L 9 270 L 18 240 Z" fill="#db2777" />
  </g>
</svg>
